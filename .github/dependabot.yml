version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    versioning-strategy: increase-if-necessary
    groups:
      # The pytest plugin pins Home Assistant; update them in the same PR.
      home-assistant:
        patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "homeassistant"
          - "pytest-homeassistant-custom-component"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/.github"
    schedule:
      interval: monthly
    groups:
      release-dependencies:
        patterns:
          - "*"
