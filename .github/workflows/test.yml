name: Tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.13

      - name: Run Ruff linter
        run: uvx ruff check .

      - name: Run Ruff formatter check
        run: uvx ruff format --check .

      - name: Test compatibility matrix selection
        run: uv run --no-project --python 3.13 python -m unittest discover -s .github/scripts -p 'test_*.py'

  compatibility-matrix:
    name: Select Home Assistant versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Generate compatibility matrix
        id: matrix
        run: |
          uv python install 3.13
          matrix=$(uv run --no-project --python 3.13 .github/scripts/ha_compat.py matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .

  test:
    name: HA ${{ matrix.version }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: [lint, compatibility-matrix]
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.compatibility-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: uv python install "$PYTHON_VERSION"

      - name: Install locked dependencies
        if: matrix.mode == 'locked'
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: uv sync --frozen --extra test

      - name: Install compatibility dependencies
        if: matrix.mode != 'locked'
        env:
          HA_VERSION: ${{ matrix.version }}
          UV_PYTHON: ${{ matrix.python }}
          EXCLUDE_NEWER: ${{ matrix.cutoff }}
        run: |
          uv venv --python "$UV_PYTHON"
          uv run --no-project --python "$UV_PYTHON" .github/scripts/ha_compat.py requirements "$HA_VERSION" > "$RUNNER_TEMP/ha-requirements.txt"
          if [[ "$HA_VERSION" == "dev" ]]; then
            uv run --no-project --python "$UV_PYTHON" .github/scripts/ha_compat.py overrides > "$RUNNER_TEMP/ha-overrides.txt"
            uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/ha-requirements.txt" --overrides "$RUNNER_TEMP/ha-overrides.txt"
          elif [[ -n "$EXCLUDE_NEWER" ]]; then
            uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/ha-requirements.txt" --exclude-newer "$EXCLUDE_NEWER"
          else
            uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/ha-requirements.txt"
          fi

      - name: Verify installed Home Assistant and show test plugin
        env:
          HA_VERSION: ${{ matrix.version }}
          HA_MODE: ${{ matrix.mode }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from importlib.metadata import version
          installed = version("homeassistant")
          print("Home Assistant:", installed)
          if os.environ["HA_MODE"] == "stable":
              print("Test plugin:", version("pytest-homeassistant-custom-component"))
              assert installed == os.environ["HA_VERSION"]
          elif os.environ["HA_MODE"] == "development":
              print("Test plugin:", version("pytest-home-assistant"))
              assert ".dev" in installed
          PY

      - name: Check integration imports against development Home Assistant
        if: matrix.mode == 'development'
        run: |
          .venv/bin/python -c 'import custom_components.dmi.config_flow; import custom_components.dmi.sensor; import custom_components.dmi.weather'

      - name: Run tests with coverage
        env:
          HA_MODE: ${{ matrix.mode }}
        run: |
          .venv/bin/python .github/scripts/run_tests.py tests/ \
            --cov=custom_components/dmi \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.mode == 'locked'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  hassfest:
    name: Validate with hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: Validate with HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - compatibility-matrix
      - test
      - hassfest
      - hacs
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.compatibility-matrix.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.hassfest.result }}" != "success" ]] || \
             [[ "${{ needs.hacs.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All checks passed!"
